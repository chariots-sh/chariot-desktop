name: Chariot
options:
  bundleIdPrefix: com.protocols
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  AgentLinkKit:
    path: AgentLinkKit
  ChariotMac:
    path: ChariotMac
settings:
  base:
    DEVELOPMENT_TEAM: 3UGCLFLDJ6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
targets:
  ChariotDesktop:
    type: application
    platform: macOS
    preBuildScripts:
      # Reproducible pure-Go build; versions pinned via agent-tailnet/go.sum.
      - name: Build agent-tailnet
        script: "\"$PROJECT_DIR/scripts/build-helper.sh\" \"$PROJECT_DIR/build/agent-tailnet\""
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/build/agent-tailnet
    sources:
      - path: ChariotMac/Sources/ChariotDesktopApp
      - path: guest/bridge.py
        buildPhase: resources
      - path: guest/user-data.template
        buildPhase: resources
      - path: build/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: ChariotMac
        product: ChariotCore
      - package: AgentLinkKit
        product: AgentLinkKit
    copyFiles:
      # The embedded Tailscale node ships beside the app executable; Xcode
      # code-signs embedded binaries with the app, so it is covered by the
      # hardened runtime and notarization.
      - destination: executables
        files:
          - path: build/agent-tailnet
            codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.protocols.chariot.mac
        CODE_SIGN_ENTITLEMENTS: ChariotMac/ChariotDesktop.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
    info:
      path: build/xcodegen/ChariotDesktop-Info.plist
      properties:
        CFBundleDisplayName: Chariot Desktop
        CFBundleIconFile: AppIcon
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
  ChariotMobilePhone:
    type: application
    platform: iOS
    sources:
      - path: ChariotMobile/Sources
    dependencies:
      - package: AgentLinkKit
        product: AgentLinkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.protocols.chariot.ios
        CODE_SIGN_ENTITLEMENTS: ChariotMobile/ChariotMobile.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: build/xcodegen/ChariotMobile-Info.plist
      properties:
        CFBundleDisplayName: Chariot
        NSCameraUsageDescription: Chariot scans the pairing QR code displayed by your Mac.
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Narrow exception scoped to tailnet MagicDNS names only: allows the
          # app's pinned-key trust decision for the Mac's self-signed cert to
          # stand when the tailnet has HTTPS certificates disabled. Never a
          # global exception; the pin in TransportSessionDelegate remains the
          # trust boundary.
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
