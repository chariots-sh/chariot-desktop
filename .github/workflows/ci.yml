name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: AgentLinkKit tests
        run: swift test --package-path AgentLinkKit
      - name: ChariotCore tests
        run: swift test --package-path ChariotMac
      - name: Build chariotd and desktop app executables
        run: swift build --package-path ChariotMac
      - name: Loopback transport E2E (pairing, WS auth, replay, revocation)
        run: scripts/e2e-transport.sh

  guest-bridge:
    name: Guest bridge tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bridge unit tests (sessions, reply channel)
        run: python3 -m unittest discover -s tests -p '*_test.py' -v

  ios-build:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build ChariotMobile.app
        run: scripts/build-ios.sh

  release-bundle:
    name: Release bundle layout (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-tailnet/go.mod
          cache-dependency-path: agent-tailnet/go.sum
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate and build the release target
        run: |
          # The helper is a gitignored build product, and XcodeGen validates
          # source paths at generation time — so it must exist before generate,
          # not just before the build.
          scripts/build-helper.sh build/agent-tailnet
          xcodegen generate --spec project.yml --project .
          xcodebuild build -project Chariot.xcodeproj -scheme ChariotDesktop \
            -configuration Release -destination "generic/platform=macOS" \
            -derivedDataPath build/dd ARCHS=arm64 \
            MARKETING_VERSION=0.0.0 CURRENT_PROJECT_VERSION=1 \
            SPARKLE_PUBLIC_ED_KEY=ci-placeholder \
            CODE_SIGNING_ALLOWED=NO | tail -5
      # XcodeGen silently drops build phases it does not recognise, which once
      # produced release bundles with no agent-tailnet in them. Assert the
      # payload rather than trusting the spec.
      - name: Assert the shipped bundle is complete
        run: |
          APP="build/dd/Build/Products/Release/Chariot Desktop.app"
          status=0
          for f in "Contents/MacOS/Chariot Desktop" \
                   "Contents/MacOS/agent-tailnet" \
                   "Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" \
                   "Contents/Resources/bridge.py" \
                   "Contents/Resources/user-data.template"; do
            if [ -e "$APP/$f" ]; then echo "ok   $f"; else echo "MISSING $f"; status=1; fi
          done
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = dev.chariot.desktop
          test "$(lipo -archs "$APP/Contents/MacOS/Chariot Desktop")" = arm64
          exit $status

      # A signed bundle can pass every static check and still be unable to
      # start: `codesign --verify --deep --strict` validates each signature
      # individually and says nothing about whether the process may load them
      # together. v0.1.0 shipped unlaunchable for exactly that reason. This
      # builds the ad-hoc bundle the way a release does and runs it.
      - name: Ad-hoc bundle launches
        run: |
          SPARKLE_PUBLIC_ED_KEY=ci-placeholder VERSION=0.0.0-ci ADHOC=1 \
            scripts/release-app.sh 2>&1 | tail -20

  agent-tailnet:
    name: agent-tailnet (Go)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-tailnet/go.mod
          cache-dependency-path: agent-tailnet/go.sum
      - name: go vet
        run: go vet ./...
        working-directory: agent-tailnet
      - name: Build universal helper binary
        run: scripts/build-helper.sh build/agent-tailnet
